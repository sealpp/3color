<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1612"/>
      <stop offset="100%" stop-color="#12100d"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <!-- 黄铜细环 -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="#c8a45c" stroke-width="3" opacity="0.7"/>
  <!-- 三原色圆 · 等边三角形对称布局（饱和基色，screen 混色出正确黄/青/品红/白） -->
  <g style="mix-blend-mode:screen">
    <circle cx="256" cy="218" r="102" fill="#eb4137"/>
    <circle cx="191" cy="332" r="102" fill="#41c355"/>
    <circle cx="321" cy="332" r="102" fill="#4178eb"/>
  </g>
</svg>
